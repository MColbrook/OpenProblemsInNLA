automation:
  methods:
  - method: agent
    models:
    - Codex (GPT-6 session identity)
    framework: OpenAI Codex
    tool_setup: 'Local Lean 4.33.1 with pinned Mathlib and LeanCert caches; at most one local
      compiler, one thread and 4096 MiB per process. Kernel-mode LeanCert. Independent source
      and proof reviewers requested at max reasoning. Real Comparator is reserved for the
      GitHub Linux runner. Ordinary Lake library builds allow 6144 MiB; the local
      verify_local.py workflow explicitly retains one thread and a 4096 MiB cap.

      '
    prompting_notes: 'User requested a restart and adversarial review of the earlier Lean
      development, preserving the manuscript. Numerical and analytic statements were written
      before proofs; incomplete obligations are explicit. Incorrect legacy interfaces are
      not reused.

      '
review:
  status: agent-reviewed (component, complete-target, and nonimplementing final referee scopes)
  reviewers:
  - 'mf21_restart_manuscript: independent mathematical and component proof review'
  - 'mf21_restart_lean_audit: independent old/new statement and contract review'
  - 'mf21_final_statement_referee: nonimplementing final statement and premise-discharge review'
  - 'mf21_final_proof_referee: nonimplementing final proof-assembly and numerical-trust review'
  notes: Two agents independently reviewed each other's components under the pinned Tau Ceti
    adaptation. The complete target and exact seven contracts were reviewed by the agent who
    did not author their assembly; its own interlacing dependencies have a separate review
    by the other agent. Two additional nonimplementing referees approved statement fidelity
    and selected proof-assembly/trust scopes, including the repaired minimal LeanCert certificate.
    Neither claims a fresh line-by-line review of all lower-level modules or an independent
    compiler execution. The coordinator compiled sources serially. Reports identify exact
    source/log/output hashes, author exclusions, and actual execution scopes. These are AI-agent
    reviews, not human peer review. Local compiler evidence and final GitHub Comparator/kernel/sandbox
    evidence are distinct. The same-statement phase tactic repair and resource-only
    Lake configuration change received a separate review. The latest local recheck
    compiled all 10 affected modules, validated 115 reused source/output/dependency
    identities, and checked all 386 actual axiom reports; an independent evidence
    audit confirmed that scope. These records do not assert Linux acceptance.
