  name: 'MF-21: the uniform Toeplitz eigenvalue expansion threshold for every m >= 3'
  description: Complete symbolic Lean proof of the original three-part target, continuous-family obstruction,
    smooth common coefficients, sharp finite-head and global errors, and exact Fourier-matrix correspondence.
    All five contracts passed actual non-root Linux Comparator and default-kernel acceptance at the recorded
    immutable proof revision.
