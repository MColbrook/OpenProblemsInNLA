  - OpenAI Codex agent independent_proof_referee (nonimplementing mathematical proof and runtime referee)
  - OpenAI Codex agent lean_audit (nonauthor cross-review only outside authored modules)
  - OpenAI Codex agent trace_audit (nonauthor trace-obstruction and uniqueness assembly review only outside
