fidelity:
  divergences: No target weakened. The finite inverse-column/Schur recurrence replaces the continuum Green-kernel
    limit. Equation (24) uses a finite-head Taylor bound. The determinant desingularization uses 2 sin(theta/2),
    which has the same simple zero as theta. See NUMERICAL_TARGETS.md.
