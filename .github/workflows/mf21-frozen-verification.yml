name: MF-21 frozen manuscript verification

on:
  push:
    paths:
      - 'matrix-functions-and-stability/MF-21/lean-frozen-2026-09-12/**'
      - '.github/workflows/mf21-frozen-verification.yml'
      - 'tools/lean/**'
      - 'docs/lean/schema/**'
  pull_request:
    paths:
      - 'matrix-functions-and-stability/MF-21/lean-frozen-2026-09-12/**'
      - '.github/workflows/mf21-frozen-verification.yml'
      - 'tools/lean/**'
      - 'docs/lean/schema/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mf21-frozen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-frozen-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_PROJECT: matrix-functions-and-stability/MF-21/lean-frozen-2026-09-12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/lean
            docs/lean/schema
            matrix-functions-and-stability/MF-21/lean-frozen-2026-09-12
      - name: Validate exact project metadata
        run: |
          python3 -m pip install -r tools/lean/requirements.txt
          python3 tools/lean/validate_manifest.py "$LEAN_PROJECT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: leanprover/lean-action@96e06131c0e9943c780388fd166f55d1e2fa0433
        with:
          lake-package-directory: ${{ env.LEAN_PROJECT }}
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Prepare unprivileged Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap dbus-user-session
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify frozen MF-21 contracts in a fresh sandbox
        run: |
          ulimit -n 65536
          tools/lean/bootstrap.sh "$RUNNER_TEMP/nla-mf21-frozen-tools"
          tools/lean/verify.sh "$LEAN_PROJECT" "$RUNNER_TEMP/nla-mf21-frozen-tools"
      - name: Retain exact-commit verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mf21-frozen-${{ github.sha }}
          path: ${{ runner.temp }}/nla-mf21-frozen-tools/logs/
          if-no-files-found: warn
